[build]
  command = "npm run build"
  publish = "dist"

# Content JSON must never be cached, or edits made in /admin
# won't show up until the browser cache expires.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pretty URL for the CMS: /admin -> /admin/
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
