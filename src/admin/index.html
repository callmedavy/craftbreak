<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Craft Break — Content Manager</title>
  <style>
    body{margin:0;background:#F7C948;font-family:"Trebuchet MS",Verdana,sans-serif;}
    #loading{
      max-width:420px;margin:14vh auto;padding:22px 24px;
      background:#FFFDF4;color:#241F14;
      border:3px solid #241F14;border-radius:14px 6px 20px 8px / 8px 18px 7px 16px;
      box-shadow:7px 8px 0 rgba(36,31,20,.3);
    }
    #loading h1{font-family:Georgia,serif;margin:0 0 8px;font-size:1.4rem;}
    #loading p{margin:0;font-size:.9rem;line-height:1.55;}
  </style>
</head>
<body>
  <div id="loading">
    <h1>Craft Break Content Manager</h1>
    <p>Loading the editor. If a login box doesn't appear within a few seconds, Netlify Identity or Git Gateway may not be enabled on this site yet.</p>
  </div>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    window.addEventListener("load", function(){
      setTimeout(function(){
        var box = document.getElementById("loading");
        if (box) box.remove();
      }, 1200);
    });
  </script>
</body>
</html>
